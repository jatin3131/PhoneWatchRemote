name: PhoneRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhoneRemote:
    type: application
    platform: iOS
    sources:
      - path: PhoneRemote
      - path: Shared
    dependencies:
      - target: PhoneRemoteIsland
    info:
      path: PhoneRemote/Info.plist
      properties:
        CFBundleDisplayName: Phone Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: Phone Remote uses Bluetooth to talk to your watch.
        NSPhotoLibraryUsageDescription: Phone Remote shows your photos so you can browse and edit them with your watch.
        NSPhotoLibraryAddUsageDescription: Phone Remote saves your edited photos.
        NSAppleMusicUsageDescription: Phone Remote shows what is playing in the Music app and lets your watch control it.
        NSContactsUsageDescription: Phone Remote sends your contacts' names and numbers to your watch so callers and the phonebook show names.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote
        TARGETED_DEVICE_FAMILY: "1"
  PhoneRemoteIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneRemoteIsland
      - path: Shared
    info:
      path: PhoneRemoteIsland/Info.plist
      properties:
        CFBundleDisplayName: Phone Remote Island
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phoneremote.island
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
