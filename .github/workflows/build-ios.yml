name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Stamp build number
        run: |
          echo "let appBuildNumber = \"${{ github.run_number }}\"" > ios/PhoneRemote/BuildInfo.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PhoneRemote.xcodeproj \
            -scheme PhoneRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R PhoneRemote.app Payload/
          zip -qry PhoneRemote-build${{ github.run_number }}.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRemote-build${{ github.run_number }}
          path: ios/build/Build/Products/Release-iphoneos/PhoneRemote-build${{ github.run_number }}.ipa
          retention-days: 30
